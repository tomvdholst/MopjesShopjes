services:
  db:
    image: ghcr.io/tomvdholst/mopjesshopjes-db:latest
    build:
      context: ./db
    environment:
      POSTGRES_DB: mopjesshopjes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/tomvdholst/mopjesshopjes-backend:latest
    build:
      context: ./backend/MopjesShopjes.Api
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=mopjesshopjes;Username=mopjesshopjes_app;Password=${APP_DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/tomvdholst/mopjesshopjes-frontend:latest
    build:
      context: ./frontend
    ports:
      - "4201:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: