<h1>Shopping list</h1>
<ul>
  @for (item of items(); track item.identifier) {
    <li>
      <input type="checkbox" [checked]="item.isChecked" (change)="toggleItem(item.identifier)">
      {{item.name}}
      <input type="button" value="delete" (click)="deleteItem(item.identifier)">
    </li>
  }
</ul>
<input #newItemName type="text">
<input type="button" (click)="addItem(newItemName.value)" value="Add">
