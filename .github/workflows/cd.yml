name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: "backend/MopjesShopjes.Api/"
          push: true
          tags: |
            - ghcr.io/tomvdholst/mopjesshopjes-backend:latest
            - ghcr.io/tomvdholst/mopjesshopjes-backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: "frontend/"
          push: true
          tags: |
            - ghcr.io/tomvdholst/mopjesshopjes-frontend:latest
            - ghcr.io/tomvdholst/mopjesshopjes-frontend:${{ github.sha }}
      